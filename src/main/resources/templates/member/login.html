<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>로그인</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 400px;
            margin: 100px auto;
            padding: 35px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 5px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1565c0;
        }

        .register {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .register a {
            color: #1976d2;
            text-decoration: none;
        }

        .error {
            margin-bottom: 15px;
            color: #e53935;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h2>로그인</h2>

    <!-- 로그인 실패 -->
    <div class="error"
         th:if="${param.error}">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <form th:action="@{/member/login}" method="post">

        <div class="form-group">
            <label for="memberLoginId">아이디</label>

            <input type="text"
                   id="memberLoginId"
                   name="memberLoginId"
                   placeholder="아이디를 입력하세요"
                   required>
        </div>

        <div class="form-group">
            <label for="memberPassword">비밀번호</label>

            <input type="password"
                   id="memberPassword"
                   name="memberPassword"
                   placeholder="비밀번호를 입력하세요"
                   required>
        </div>

        <button type="submit">
            로그인
        </button>

    </form>

    <div class="register">
        계정이 없으신가요?
        <a th:href="@{/member/join}">
            회원가입
        </a>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 450px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .gender {
            display: flex;
            gap: 20px;
        }

        .gender label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .gender input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 5px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1565c0;
        }
        .hint {
            margin: 6px 0 0;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>회원가입</h2>

    <form th:action="@{/member/join}" th:object="${member}" method="post">

        <!-- 이름 -->
        <div class="form-group">
            <label for="memberName">이름</label>
            <input type="text"
                   id="memberName"
                   th:field="*{memberName}"
                   name="memberName"
                   placeholder="이름을 입력하세요"
                   required>
        </div>

        <!-- 이메일 -->
        <div class="form-group">
            <label for="memberEmail">이메일</label>
            <input type="email"
                   id="memberEmail"
                   th:field="*{memberEmail}"
                   name="memberEmail"
                   placeholder="example@email.com">
        </div>

        <!-- 로그인 ID -->
        <div class="form-group">
            <label for="memberLoginId">아이디</label>
            <input type="text"
                   id="memberLoginId"
                   th:field="*{memberLoginId}"
                   name="memberLoginId"
                   placeholder="아이디를 입력하세요"
                   required>
        </div>

        <!-- 비밀번호 -->
        <div class="form-group">
            <label for="memberPassword">비밀번호</label>
            <input type="password"
                   id="memberPassword"
                   th:field="*{memberPassword}"
                   name="memberPassword"
                   placeholder="비밀번호를 입력하세요"
                   required>
        </div>

        <!-- 지역 -->
        <div class="form-group">
            <label for="memberRegion">지역</label>

            <select id="memberRegion"
                    name="memberRegion"
                    th:field="*{memberRegion}"
                    required>

                <option value="">지역을 선택하세요</option>

                <option th:each="region : ${regions}"
                        th:value="${region.regionCodes[0]}"
                        th:text="${region.regionName}"></option>

            </select>
        </div>
        <!-- 시·군 (선택) : 지역을 고르면 아래 원본 목록에서 그 지역 것만 복사해서 채움 -->
        <div class="form-group">
            <label for="sigunguCode">시·군 (선택)</label>
            <select id="sigunguCode" name="sigunguCode" disabled>
                <option value="">지역을 먼저 선택하세요</option>
            </select>
            <p class="hint">시·군까지 고르면 우리 동네 정책도 정확히 찾아드려요.</p>
        </div>
        <!-- 생년월일 -->
        <div class="form-group">
            <label for="memberBirth">생년월일</label>
            <input type="date"
                   id="memberBirth"
                   th:field="*{memberBirth}"
                   name="memberBirth"
                   required>
        </div>

        <!-- 성별 -->
        <div class="form-group">
            <label>성별</label>

            <div class="gender">
                <label>
                    <input type="radio"
                           name="memberGender"
                           th:field="*{memberGender}"
                           value="남성">
                    남성
                </label>

                <label>
                    <input type="radio"
                           name="memberGender"
                           th:field="*{memberGender}"
                           value="여성">
                    여성
                </label>
            </div>
        </div>

        <!-- 전화번호 -->
        <div class="form-group">
            <label for="memberPhone">전화번호</label>
            <input type="tel"
                   id="memberPhone"
                   th:field="*{memberPhone}"
                   name="memberPhone"
                   placeholder="010-1234-5678">
        </div>

        <button type="submit">회원가입</button>

    </form>
    <!-- 시·군 원본 목록 (화면에 안 보이고 전송도 안 됨, name 없음) -->
    <select id="sigunguSource" hidden>
        <optgroup th:each="g : ${sigunguGroups}" th:attr="data-sido=${g.sidoCode()}">
            <option th:each="u : ${g.units()}"
                    th:value="${u.unitCode()}"
                    th:text="${u.unitName()}"></option>
        </optgroup>
    </select>

    <script>
        (function () {
            const region = document.getElementById('memberRegion');
            const sigungu = document.getElementById('sigunguCode');
            const source = document.getElementById('sigunguSource');

            // 고른 지역의 시·군만 sigungu select에 다시 채움
            function refresh() {
                sigungu.innerHTML = '';
                const group = source.querySelector('optgroup[data-sido="' + region.value + '"]');

                if (!group) {
                    sigungu.add(new Option('지역을 먼저 선택하세요', ''));
                    sigungu.disabled = true;
                    return;
                }

                sigungu.add(new Option('선택 안 함', ''));
                group.querySelectorAll('option').forEach(function (o) {
                    sigungu.add(new Option(o.text, o.value));
                });

                // 서울·세종처럼 시 전체가 1단위면 자동 선택
                if (group.children.length === 1) {
                    sigungu.selectedIndex = 1;
                }
                sigungu.disabled = false;
            }

            region.addEventListener('change', refresh);
            refresh();
        })();
    </script>
</div>

</body>
</html>

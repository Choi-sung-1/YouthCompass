<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    찜 버튼 조각 (5장 약속: button(policyId, bookmarked)) — 작은 하트 버튼
    사용 예) 카드 오른쪽 위에 두려면 부르는 쪽에서 감싸서 위치를 잡는다
        <div class="bookmark-corner">
            <div th:replace="~{fragments/bookmark :: button(${p.policyId}, ${bookmarked})}"></div>
        </div>
        .bookmark-corner { position: absolute; top: 14px; right: 14px; }  (카드에는 position: relative)
    - loginId 는 GlobalModelAdvice 가 모든 화면에 넣어 줌 → null 이면 비로그인
    - 누르면 POST /bookmarks/{policyId} → 토글 후 Referer(지금 보던 화면)로 돌아옴
    - common.css(A 담당)를 고치지 않으려고 스타일은 조각 안에 직접 둠
-->
<th:block th:fragment="button(policyId, bookmarked)">

    <!-- 로그인: 하트 토글 버튼 (찜: 빨간 ♥ / 안 찜: 회색 ♡) -->
    <form th:if="${loginId != null}"
          th:action="@{/bookmarks/{id}(id=${policyId})}" method="post"
          style="display: inline; margin: 0;">
        <button type="submit" class="bookmark-btn"
                th:classappend="${bookmarked} ? 'on'"
                th:title="${bookmarked} ? '찜 해제' : '찜하기'"
                th:attr="aria-label=${bookmarked} ? '찜 해제' : '찜하기'"
                style="width: 34px; height: 34px; padding: 0; border: 1px solid #e5e7eb; border-radius: 50%;
                       background: #fff; font-size: 18px; line-height: 1; cursor: pointer;"
                th:styleappend="${bookmarked} ? 'color: #e11d48;' : 'color: #9ca3af;'"
                th:text="${bookmarked} ? '♥' : '♡'">♡</button>
    </form>

    <!-- 비로그인: 같은 모양의 하트를 누르면 로그인 화면으로 -->
    <a th:if="${loginId == null}" th:href="@{/member/login}"
       class="bookmark-btn" title="로그인 후 찜하기" aria-label="로그인 후 찜하기"
       style="display: inline-flex; align-items: center; justify-content: center;
              width: 34px; height: 34px; border: 1px solid #e5e7eb; border-radius: 50%;
              background: #fff; color: #9ca3af; font-size: 18px; text-decoration: none;">♡</a>

</th:block>

</body>
</html>

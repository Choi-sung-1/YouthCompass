<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    확인 필요 조건 다시 판정 (A 담당, 약속 ④)
    사용: 카드 안 자격 조건 목록 바로 아래
          <div th:replace="~{fragments/recheck :: buttons(${policy})}"></div>
          + 페이지 맨 아래 <script th:src="@{/js/recheck.js}"></script>
    - 확인 필요 조건이 있는 카드에만 보임
    - class 이름(recheck, recheck-start, recheck-body)은 recheck.js가 찾는 이름이라 바꾸지 말 것
-->
<th:block th:fragment="buttons(policy)">
    <div class="recheck"
         th:if="${policy.unknownReasons != null and !#lists.isEmpty(policy.unknownReasons)}"
         th:attr="data-policy-id=${policy.policyId}">
        <button type="button" class="recheck-start">확인 필요 조건 답하고 다시 확인</button>
        <div class="recheck-body"></div>
    </div>
</th:block>

</body>
</html>

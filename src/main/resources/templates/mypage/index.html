<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지 | YouthCompass</title>
    <th:block th:replace="~{fragments/layout :: assets}"></th:block>
    <style>
        /* 1단 배치 (넓은 화면에서도 가운데 한 줄) */
        .mypage { max-width: 680px; margin: 0 auto; display: grid; gap: 16px; }
        .mypage h1 { margin: 0; font-size: 24px; }
        .mypage h2 { margin: 0 0 12px; font-size: 17px; }

        /* 요약 3칸 (누르면 각 목록으로) */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .stat { display: block; color: var(--color-text); text-align: center; padding: 16px 8px; }
        .stat:hover { text-decoration: none; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12); }
        .stat .num { display: block; font-size: 26px; font-weight: 700; color: var(--color-primary); line-height: 1.2; }
        .stat .num.warn { color: var(--color-unknown); }
        .stat .label { color: var(--color-muted); font-size: 13px; }

        /* 마감 임박 찜 */
        .mini-list { list-style: none; margin: 0; padding: 0; }
        .mini-list li { display: flex; align-items: center; gap: 8px; padding: 8px 0;
            border-top: 1px solid var(--color-border); font-size: 14px; }
        .mini-list li:first-child { border-top: none; padding-top: 0; }
        .mini-list a { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text); }

        /* 조건 프로필: 저장된 값 칩 + 접는 수정 폼 */
        .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
        .count { color: var(--color-muted); font-size: 13px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 999px;
            padding: 3px 10px; font-size: 13px; }
        .chip .k { color: var(--color-muted); margin-right: 4px; }
        .empty { color: var(--color-muted); font-size: 14px; margin: 0; }
        details { margin-top: 12px; }
        summary { color: var(--color-primary); cursor: pointer; font-size: 14px; }
        details form { margin-top: 12px; }

        .form-row { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 10px; margin-bottom: 10px; }
        .form-row label { font-size: 14px; }
        .form-row select, .form-row input {
            width: 100%; min-width: 0; padding: 8px 10px;
            border: 1px solid var(--color-border); border-radius: 8px; font-size: 14px; background: #fff;
        }
        .notice { padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
        .notice-ok { background: #dcfce7; color: var(--color-ok); }
        .notice-error { background: #fee2e2; color: var(--color-no); }

        /* 내 정보 */
        .info { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: 14px; }
        .info dt { color: var(--color-muted); }
        .info dd { margin: 0; overflow-wrap: anywhere; }

        /* 휴대폰: 폼 라벨을 입력칸 위로, 요약 칸 작게 */
        @media (max-width: 520px) {
            .stats { gap: 8px; }
            .stat { padding: 12px 4px; }
            .stat .num { font-size: 22px; }
            .stat .label { font-size: 12px; }
            .form-row { grid-template-columns: 1fr; gap: 4px; }
            .form-row button, details .btn-primary { width: 100%; }
        }
    </style>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container page">
    <div class="mypage">

        <h1 th:text="${member.memberName} + '님'">마이페이지</h1>

        <!-- 요약 -->
        <div class="stats">
            <a class="card stat" th:href="@{/mypage/bookmarks}">
                <span class="num" th:text="${bookmarkCount}">0</span>
                <span class="label">찜한 정책</span>
            </a>
            <a class="card stat" th:href="@{/mypage/bookmarks}">
                <span class="num" th:classappend="${closingSoonCount > 0} ? 'warn'" th:text="${closingSoonCount}">0</span>
                <span class="label">7일 안에 마감</span>
            </a>
            <a class="card stat" th:href="@{/mypage/history}">
                <span class="num" th:text="${historyCount}">0</span>
                <span class="label">추천 기록</span>
            </a>
        </div>

        <!-- 마감 임박 찜 (있을 때만, 마감 가까운 순 3개) -->
        <section class="card" th:if="${!#lists.isEmpty(closingSoon)}">
            <h2>곧 마감되는 찜</h2>
            <ul class="mini-list">
                <li th:each="p : ${closingSoon}">
                    <a th:href="@{/policies/{id}(id=${p.policyId})}" th:text="${p.policyName}">정책명</a>
                    <span class="badge badge-unknown" th:text="${p.deadlineLabel}">D-3</span>
                </li>
            </ul>
        </section>

        <!-- 내 조건 프로필: 평소엔 저장된 값만, 수정하기를 누르면 폼 -->
        <section class="card">
            <div class="section-head">
                <h2>내 조건 프로필</h2>
                <span class="count" th:text="${profileTotal} + '개 중 ' + ${profileForm.filledCount()} + '개 입력'">6개 중 0개 입력</span>
            </div>

            <div th:if="${profileSaved}" class="notice notice-ok">저장했어요.</div>
            <div th:if="${profileError}" class="notice notice-error" th:text="${profileError}"></div>

            <div class="chips" th:if="${profileForm.filledCount() > 0}">
                <span class="chip" th:if="${sigunguName}"><span class="k">거주</span><b th:text="${sigunguName}"></b></span>
                <span class="chip" th:if="${profileForm.school}"><span class="k">학력</span><b th:text="${profileForm.school.description}"></b></span>
                <span class="chip" th:if="${profileForm.job}"><span class="k">취업</span><b th:text="${profileForm.job.description}"></b></span>
                <span class="chip" th:if="${profileForm.marriage}"><span class="k">혼인</span><b th:text="${profileForm.marriage.description}"></b></span>
                <span class="chip" th:if="${profileForm.major}"><span class="k">전공</span><b th:text="${profileForm.major.description}"></b></span>
                <span class="chip" th:if="${profileForm.annualIncome != null}"><span class="k">연소득</span><b th:text="${#numbers.formatInteger(profileForm.annualIncome, 1, 'COMMA')} + '만원'"></b></span>
            </div>
            <p class="empty" th:if="${profileForm.filledCount() == 0}">
                저장해 두면 추천할 때 문장에 없는 조건을 자동으로 채워요.
            </p>

            <!-- 아무것도 안 채웠거나 입력 오류가 있으면 펼친 채로 -->
            <details th:open="${profileForm.filledCount() == 0 or profileError != null}">
                <summary th:text="${profileForm.filledCount() == 0} ? '입력하기' : '수정하기'">수정하기</summary>

                <form th:action="@{/mypage/profile}" th:object="${profileForm}" method="post">
                    <div class="form-row">
                        <label for="sigunguCode">거주 시·군</label>
                        <select th:field="*{sigunguCode}">
                            <option value="">선택 안 함</option>
                            <optgroup th:each="g : ${sigunguGroups}" th:label="${g.sidoName()}">
                                <option th:each="u : ${g.units()}"
                                        th:value="${u.unitCode()}"
                                        th:text="${u.unitName()}"></option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="school">학력</label>
                        <select th:field="*{school}">
                            <option value="">모름</option>
                            <option th:each="o : ${schoolOptions}" th:value="${o}" th:text="${o.description}"></option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="job">취업 상태</label>
                        <select th:field="*{job}">
                            <option value="">모름</option>
                            <option th:each="o : ${jobOptions}" th:value="${o}" th:text="${o.description}"></option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="marriage">혼인 상태</label>
                        <select th:field="*{marriage}">
                            <option value="">모름</option>
                            <option th:each="o : ${marriageOptions}" th:value="${o}" th:text="${o.description}"></option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="major">전공</label>
                        <select th:field="*{major}">
                            <option value="">모름</option>
                            <option th:each="o : ${majorOptions}" th:value="${o}" th:text="${o.description}"></option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="annualIncome">연소득(만원)</label>
                        <input type="number" min="0" th:field="*{annualIncome}" placeholder="2400">
                    </div>

                    <button type="submit" class="btn btn-primary">저장</button>
                </form>
            </details>
        </section>

        <!-- 내 정보 -->
        <section class="card">
            <h2>내 정보</h2>
            <dl class="info">
                <dt>아이디</dt>
                <dd th:text="${member.memberLoginId}"></dd>
                <dt>생년월일</dt>
                <dd th:text="${member.memberBirth} ?: '-'"></dd>
                <dt>지역</dt>
                <dd th:text="${regionName} ?: '-'"></dd>
            </dl>
        </section>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>추천 기록 상세 | YouthCompass</title>
    <th:block th:replace="~{fragments/layout :: assets}"></th:block>
    <!-- 카드·요약·칩 모양은 AI 추천 결과 화면과 같은 CSS (policy/recommend.html) -->
    <link rel="stylesheet" th:href="@{/css/policy-card.css}">
    <style>
        /* 추천 결과 화면과 같은 폭: 카드는 한 줄에 3개라 넓게, 위쪽 기록 정보는 .narrow 폭 */
        .page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px 72px;
            color: var(--rc-body);
        }

        .narrow {
            max-width: 820px;
            margin-left: auto;
            margin-right: auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 14px;
            color: var(--color-muted);
            font-size: 14px;
        }

        .back:hover {
            color: var(--color-primary);
            text-decoration: none;
        }

        .title-row {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        h1 {
            margin: 0 0 8px;
            color: var(--color-text);
            font-size: 28px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin: 0 0 28px;
            color: var(--color-muted);
            font-size: 16px;
        }

        .title-row .btn {
            border-color: var(--rc-line);
            color: var(--color-muted);
            font-size: 14px;
        }

        .title-row .btn:hover {
            border-color: #f1b8b8;
            color: var(--color-no);
        }

        /* 그때 입력한 문장 */
        .sentence {
            margin: 0;
            padding: 14px 16px;
            border: 1px solid var(--rc-line);
            border-radius: 10px;
            background: var(--rc-soft);
            color: var(--color-text);
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-line;
        }

        .sentence.missing {
            color: #9ca3af;
        }

        /* 정책 정보가 지워진 기록 카드 */
        .policy.gone .policy-name {
            color: #9ca3af;
        }

        .gone-note {
            margin: 14px 0 0;
            color: var(--color-muted);
            font-size: 14px;
        }

        @media (max-width: 640px) {
            .page {
                padding: 24px 16px 48px;
            }
        }
    </style>
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page">

    <div class="narrow">
        <a class="back" th:href="@{/mypage/history}">← 추천 기록 목록</a>

        <div class="title-row">
            <div>
                <h1>추천 기록</h1>
                <p class="subtitle"
                   th:text="${#temporals.format(detail.createdAt, 'yyyy.MM.dd HH:mm')} + ' 에 받은 추천이에요.'">받은 시각</p>
            </div>
            <form th:action="@{/mypage/history/{id}/delete(id=${detail.historyId})}" method="post" class="inline"
                  onsubmit="return confirm('이 추천 기록을 삭제할까요? 되돌릴 수 없어요.');">
                <button type="submit" class="btn">기록 삭제</button>
            </form>
        </div>
    </div>

    <!-- 그때 입력한 문장 -->
    <div class="box narrow">
        <h2>그때 입력한 문장</h2>
        <p class="sentence" th:if="${detail.sentence}" th:text="${detail.sentence}">입력한 문장</p>
        <p class="sentence missing" th:unless="${detail.sentence}">(입력 문장 없음)</p>
    </div>

    <!-- 그때 AI가 이해한 조건 (저장된 PROFILE_JSON → 칩) -->
    <div class="box narrow" th:if="${!#maps.isEmpty(detail.conditions)}">
        <h2>그때 AI가 이해한 조건</h2>
        <div class="chips">
            <span class="chip" th:each="c : ${detail.conditions}">
                <span class="label" th:text="${c.key}">나이</span><b th:text="${c.value}">25세</b>
            </span>
        </div>
    </div>

    <!-- 요약 (추천 결과 화면과 같은 모양) -->
    <div class="result-top">
        <div class="box summary-box">
            <h2 class="result-title">
                그때 받은 추천 <span th:text="${#lists.size(detail.items)}">10</span>개
            </h2>
            <div class="stats" th:if="${!#lists.isEmpty(detail.items)}">
                <div class="stat ready">
                    <b th:text="${#lists.size(detail.items.?[card != null and card.unknownReasons.isEmpty()])}">0</b>바로 신청 가능
                </div>
                <div class="stat soon">
                    <b th:text="${#lists.size(detail.items.?[closingSoon])}">0</b>7일 안에 마감
                </div>
                <div class="stat check">
                    <b th:text="${#lists.size(detail.items.?[card != null and !card.unknownReasons.isEmpty()])}">0</b>확인 필요
                </div>
            </div>
            <p class="result-note">추천 이유·기대 효과는 그때 저장한 내용이고, 자격 조건·마감·신청 정보는
                그때 조건으로 오늘 정책 정보를 다시 확인한 결과예요.</p>
        </div>
    </div>

    <!-- 그때의 추천 카드 (RecommendHistoryItemDTO.card → 추천 결과와 같은 조각) -->
    <div class="policy-grid" th:if="${!#lists.isEmpty(detail.items)}">
        <th:block th:each="item : ${detail.items}">

            <!-- 정책 정보가 있으면: 추천 결과와 같은 카드 (다시 판정 버튼은 조건 수정 폼이 없어서 뺌) -->
            <th:block th:if="${item.card != null}"
                      th:with="notice=${#lists.isEmpty(item.notMatchedConditions)} ? null
                              : '지금 정책 정보로는 ' + ${#strings.listJoin(item.notMatchedConditions, ', ')}
                                + ' 조건이 맞지 않아요. 공고를 다시 확인해 주세요.'">
                <div th:replace="~{fragments/policy-card :: card(${item.card}, ${item.rankNo}, ${notice}, false)}"></div>
            </th:block>

            <!-- 정책 정보가 없으면: 저장해 둔 문장만 -->
            <div class="box policy gone" th:if="${item.card == null}">
                <div class="policy-head">
                    <span class="rank" th:text="${item.rankNo}">1</span>
                    <div>
                        <span class="policy-name" th:text="${item.policyName} ?: '정책 정보 없음'">정책명</span>
                    </div>
                </div>
                <p class="gone-note">지금은 정책 정보를 찾을 수 없어요. 그때 저장한 내용만 보여드려요.</p>
                <div class="insight why" th:if="${item.reason}">
                    <span class="title">추천 이유</span>
                    <span th:text="${item.reason}"></span>
                </div>
                <div class="insight effect" th:if="${item.effect}">
                    <span class="title">기대 효과</span>
                    <span th:text="${item.effect}"></span>
                </div>
            </div>
        </th:block>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    // 찜 버튼: 새로고침 없이 fetch로 토글만 보내고, 버튼 글자·색만 바꾼다 (스크롤 위치 유지)
    document.querySelectorAll('form[action^="/bookmarks/"]').forEach(function (form) {
        form.addEventListener("submit", function (event) {
            event.preventDefault();
            const btn = form.querySelector("button");
            btn.disabled = true;

            fetch(form.action, { method: "POST" })
                .then(function (res) {
                    // 로그인이 풀렸으면 로그인 화면으로 리다이렉트됨 → 실패로 처리
                    if (!res.ok || res.url.includes("/member/login")) {
                        throw new Error("찜 실패");
                    }
                    const nowBookmarked = !btn.classList.contains("btn-primary");
                    btn.classList.toggle("btn-primary", nowBookmarked);
                    btn.textContent = nowBookmarked ? "♥ 찜 해제" : "♡ 찜하기";
                })
                .catch(function () {
                    alert("찜 처리에 실패했어요. 다시 로그인한 뒤 시도해 주세요.");
                })
                .finally(function () {
                    btn.disabled = false;
                });
        });
    });
</script>
</body>
</html>
